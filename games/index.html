<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mason 小游戏</title>
  <style>
    :root {
      --ink: #1d2028;
      --line: #25222b;
      --paper: #fff8ed;
      --red: #f15b5b;
      --blue: #3577f0;
      --green: #31b978;
      --yellow: #f5c94a;
      --pink: #ff7aa9;
      --teal: #20b7a8;
      --shadow: 0 22px 46px rgba(18, 22, 30, .16);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: ui-rounded, "SF Pro Rounded", "Microsoft YaHei", system-ui, sans-serif;
      background:
        linear-gradient(90deg, rgba(29,32,40,.045) 1px, transparent 1px),
        linear-gradient(0deg, rgba(29,32,40,.045) 1px, transparent 1px),
        linear-gradient(135deg, #fff8ed 0%, #eff8ff 42%, #fff0f5 100%);
      background-size: 30px 30px, 30px 30px, auto;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .hub {
      width: min(1120px, calc(100vw - 28px));
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr;
      gap: 18px;
      margin: 0 auto;
      padding: 28px 0;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
    }

    h1 {
      margin: 0;
      font-size: clamp(34px, 5vw, 72px);
      line-height: .96;
      letter-spacing: 0;
    }

    .home {
      flex: 0 0 auto;
      padding: 10px 13px;
      border: 2px solid var(--line);
      border-radius: 8px;
      background: #fff;
      box-shadow: 4px 4px 0 rgba(29,32,40,.92);
      font-weight: 900;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
      align-content: center;
    }

    .game-card {
      position: relative;
      min-height: 460px;
      display: grid;
      grid-template-rows: 1fr auto;
      gap: 14px;
      padding: 16px;
      border: 4px solid var(--line);
      border-radius: 8px;
      background: rgba(255,255,255,.84);
      box-shadow: var(--shadow), 8px 8px 0 rgba(29,32,40,.94);
      overflow: hidden;
      transition: transform 150ms ease, box-shadow 150ms ease;
    }

    .game-card:hover,
    .game-card:focus-visible {
      transform: translate(-2px, -2px);
      box-shadow: var(--shadow), 11px 11px 0 rgba(29,32,40,.94);
      outline: none;
    }

    .visual {
      min-height: 320px;
      display: grid;
      place-items: center;
      border: 3px solid var(--line);
      border-radius: 8px;
      background:
        linear-gradient(180deg, rgba(255,255,255,.7), rgba(255,255,255,.45)),
        repeating-linear-gradient(135deg, rgba(53,119,240,.11) 0 22px, rgba(49,185,120,.10) 22px 44px);
      overflow: hidden;
    }

    .visual svg {
      width: min(92%, 430px);
      height: auto;
      overflow: visible;
    }

    .meta {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 14px;
    }

    h2 {
      margin: 0;
      font-size: clamp(24px, 3vw, 38px);
      line-height: 1.04;
      letter-spacing: 0;
    }

    .tag {
      flex: 0 0 auto;
      padding: 8px 10px;
      border: 2px solid var(--line);
      border-radius: 999px;
      background: var(--yellow);
      box-shadow: 3px 3px 0 rgba(29,32,40,.9);
      font-size: 13px;
      font-weight: 1000;
    }

    .restaurant .visual {
      background:
        linear-gradient(180deg, rgba(255,255,255,.72), rgba(255,255,255,.46)),
        repeating-linear-gradient(90deg, rgba(245,201,74,.16) 0 28px, rgba(255,122,169,.12) 28px 56px);
    }

    @media (max-width: 800px) {
      .hub {
        width: min(100% - 20px, 560px);
        padding: 18px 0 24px;
      }

      header,
      .grid {
        grid-template-columns: 1fr;
      }

      header {
        display: grid;
      }

      .home {
        justify-self: start;
      }

      .game-card {
        min-height: 380px;
      }

      .visual {
        min-height: 260px;
      }
    }
  </style>
</head>
<body>
  <main class="hub">
    <header>
      <h1>Mason 小游戏</h1>
      <a class="home" href="/">Mason's Apps</a>
    </header>

    <section class="grid" aria-label="小游戏入口">
      <a class="game-card music" href="/letter-band-box/">
        <div class="visual">
          <svg viewBox="0 0 520 360" role="img" aria-label="字母乐队盒">
            <rect x="28" y="42" width="464" height="276" rx="12" fill="#fff" stroke="#25222b" stroke-width="8"/>
            <path d="M62 260c0-76 49-126 110-126s110 50 110 126" fill="#3577f0" stroke="#25222b" stroke-width="8"/>
            <circle cx="172" cy="118" r="58" fill="#f0b98d" stroke="#25222b" stroke-width="8"/>
            <path d="M115 95c22-44 88-48 116 3-38 1-73-4-116-3z" fill="#20242c" stroke="#25222b" stroke-width="7"/>
            <circle cx="151" cy="116" r="6" fill="#25222b"/>
            <circle cx="193" cy="116" r="6" fill="#25222b"/>
            <path d="M151 142c13 10 29 10 42 0" fill="none" stroke="#25222b" stroke-width="7" stroke-linecap="round"/>
            <path d="M208 206c-18 29 2 61 36 50 23-7 33-30 23-51 27 2 55-18 48-49-7-30-49-36-67-14-15 17-25 30-40 64z" fill="#f15b5b" stroke="#25222b" stroke-width="8"/>
            <circle cx="244" cy="214" r="20" fill="#fff" stroke="#25222b" stroke-width="7"/>
            <path d="M274 154l76-76" stroke="#25222b" stroke-width="11" stroke-linecap="round"/>
            <path d="M336 75h36" stroke="#25222b" stroke-width="12" stroke-linecap="round"/>
            <g transform="translate(338 150)">
              <rect x="0" y="0" width="64" height="64" rx="10" fill="#f5c94a" stroke="#25222b" stroke-width="6"/>
              <text x="32" y="43" text-anchor="middle" font-size="34" font-family="system-ui" font-weight="900" fill="#25222b">A</text>
            </g>
            <g transform="translate(420 222)">
              <circle cx="32" cy="32" r="33" fill="#31b978" stroke="#25222b" stroke-width="6"/>
              <text x="32" y="44" text-anchor="middle" font-size="34" font-family="system-ui" font-weight="900" fill="#25222b">B</text>
            </g>
          </svg>
        </div>
        <div class="meta">
          <h2>字母乐队盒</h2>
          <span class="tag">开玩</span>
        </div>
      </a>

      <a class="game-card restaurant" href="/restaurant-pot/">
        <div class="visual">
          <svg viewBox="0 0 520 360" role="img" aria-label="餐厅小锅局">
            <rect x="34" y="222" width="452" height="88" rx="12" fill="#dd9f53" stroke="#25222b" stroke-width="8"/>
            <path d="M145 269h230c0-78-51-129-115-129s-115 51-115 129z" fill="#20b7a8" stroke="#25222b" stroke-width="8"/>
            <circle cx="260" cy="112" r="54" fill="#f0b98d" stroke="#25222b" stroke-width="8"/>
            <path d="M207 94c22-44 87-49 111 4-39 1-72-4-111-4z" fill="#20242c" stroke="#25222b" stroke-width="7"/>
            <circle cx="239" cy="112" r="6" fill="#25222b"/>
            <circle cx="281" cy="112" r="6" fill="#25222b"/>
            <path d="M242 137c12 15 26 15 38 0" fill="none" stroke="#25222b" stroke-width="7" stroke-linecap="round"/>
            <g transform="translate(70 150)">
              <path d="M38 19h174v70c0 46-36 84-87 84S38 135 38 89z" fill="#f15b5b" stroke="#25222b" stroke-width="8"/>
              <ellipse cx="125" cy="52" rx="70" ry="27" fill="#ffd1c1" stroke="#25222b" stroke-width="7"/>
              <path d="M102 5c-20-18-3-42 4-60M133 5c-14-20 8-42 8-64M164 5c-20-20 1-42 4-60" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" opacity=".88"/>
            </g>
            <g transform="translate(352 154) rotate(-18)">
              <rect x="0" y="20" width="140" height="13" rx="7" fill="#b87539" stroke="#25222b" stroke-width="5"/>
              <rect x="-2" y="48" width="144" height="13" rx="7" fill="#b87539" stroke="#25222b" stroke-width="5"/>
            </g>
            <circle cx="78" cy="276" r="26" fill="#31b978" stroke="#25222b" stroke-width="6"/>
            <circle cx="432" cy="270" r="25" fill="#f5c94a" stroke="#25222b" stroke-width="6"/>
          </svg>
        </div>
        <div class="meta">
          <h2>餐厅小锅局</h2>
          <span class="tag">开玩</span>
        </div>
      </a>
    </section>
  </main>
</body>
</html>
