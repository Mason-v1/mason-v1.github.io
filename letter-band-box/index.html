<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>字母乐队盒</title>
  <style>
    :root {
      --ink: #181a20;
      --paper: #fffaf0;
      --line: #27222b;
      --red: #f05d5e;
      --blue: #3d7bfd;
      --green: #2fbf71;
      --yellow: #f7c948;
      --violet: #8b5cf6;
      --cyan: #22b8cf;
      --panel: rgba(255, 255, 255, 0.82);
      --shadow: 0 18px 45px rgba(20, 22, 30, 0.16);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: ui-rounded, "SF Pro Rounded", "Microsoft YaHei", system-ui, sans-serif;
      background:
        linear-gradient(90deg, rgba(24, 26, 32, 0.04) 1px, transparent 1px),
        linear-gradient(0deg, rgba(24, 26, 32, 0.04) 1px, transparent 1px),
        linear-gradient(135deg, #fffaf0 0%, #f3f8ff 45%, #fff4f3 100%);
      background-size: 28px 28px, 28px 28px, auto;
      overflow-x: hidden;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .app {
      width: min(1180px, calc(100vw - 28px));
      margin: 0 auto;
      padding: 22px 0 28px;
    }

    .topbar {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 16px;
      align-items: center;
      margin-bottom: 16px;
    }

    h1 {
      margin: 0;
      font-size: clamp(28px, 4vw, 54px);
      line-height: 0.98;
      letter-spacing: 0;
    }

    .stats {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: flex-end;
      align-items: center;
    }

    .stat {
      min-width: 82px;
      padding: 9px 12px;
      border: 2px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: 4px 4px 0 rgba(24, 26, 32, 0.9);
      text-align: center;
    }

    .stat b {
      display: block;
      font-size: 20px;
      line-height: 1;
    }

    .stat span {
      display: block;
      margin-top: 4px;
      font-size: 12px;
      color: #5e6472;
    }

    .stage {
      display: grid;
      grid-template-columns: minmax(240px, 310px) minmax(360px, 1fr) minmax(230px, 280px);
      gap: 16px;
      align-items: stretch;
    }

    .band,
    .pad,
    .side {
      min-width: 0;
    }

    .band {
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 14px;
    }

    .section-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin: 0 0 8px;
      font-size: 14px;
      font-weight: 800;
      text-transform: uppercase;
    }

    .picker {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .choice {
      position: relative;
      min-height: 72px;
      padding: 8px;
      border: 2px solid var(--line);
      border-radius: 8px;
      color: var(--ink);
      background: #fff;
      box-shadow: 3px 3px 0 rgba(24, 26, 32, 0.88);
      transition: transform 140ms ease, box-shadow 140ms ease, background 140ms ease;
    }

    .choice:hover,
    .choice:focus-visible {
      transform: translate(-1px, -1px);
      box-shadow: 5px 5px 0 rgba(24, 26, 32, 0.88);
      outline: none;
    }

    .choice.active {
      background: var(--yellow);
      transform: translate(2px, 2px);
      box-shadow: 1px 1px 0 rgba(24, 26, 32, 0.88);
    }

    .choice svg {
      width: 42px;
      height: 42px;
      display: block;
      margin: 0 auto 4px;
    }

    .choice span {
      display: block;
      overflow-wrap: anywhere;
      font-size: 13px;
      font-weight: 800;
      text-align: center;
    }

    .performer {
      position: relative;
      display: grid;
      place-items: center;
      min-height: 302px;
      padding: 16px;
      border: 3px solid var(--line);
      border-radius: 8px;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.72), rgba(255,255,255,0.45)),
        repeating-linear-gradient(90deg, rgba(61,123,253,0.12) 0 18px, rgba(47,191,113,0.10) 18px 36px);
      box-shadow: var(--shadow), 6px 6px 0 rgba(24, 26, 32, 0.92);
      overflow: hidden;
    }

    .spotlight {
      position: absolute;
      inset: 10px;
      border: 2px dashed rgba(24, 26, 32, 0.22);
      border-radius: 8px;
      pointer-events: none;
    }

    .avatar-wrap {
      position: relative;
      width: min(230px, 78vw);
      aspect-ratio: 1 / 1.16;
      display: grid;
      place-items: center;
      transform-origin: 50% 80%;
      transition: filter 180ms ease;
    }

    .avatar-wrap.playing {
      animation: groove 420ms ease;
      filter: saturate(1.18);
    }

    .avatar-wrap.hit-strong {
      animation: grooveStrong 470ms ease;
    }

    @keyframes groove {
      0%, 100% { transform: rotate(0deg) translateY(0); }
      25% { transform: rotate(-2deg) translateY(-5px); }
      60% { transform: rotate(2deg) translateY(1px); }
    }

    @keyframes grooveStrong {
      0%, 100% { transform: scale(1) rotate(0); }
      35% { transform: scale(1.05) rotate(-4deg); }
      70% { transform: scale(0.98) rotate(3deg); }
    }

    .avatar-wrap svg {
      position: absolute;
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .avatar-name {
      position: absolute;
      left: 12px;
      right: 12px;
      bottom: 12px;
      display: flex;
      justify-content: space-between;
      gap: 8px;
      align-items: center;
      font-weight: 900;
      font-size: 14px;
    }

    .now-note {
      min-width: 48px;
      padding: 5px 9px;
      border: 2px solid var(--line);
      border-radius: 8px;
      background: #fff;
      text-align: center;
      box-shadow: 2px 2px 0 var(--line);
    }

    .pad {
      display: grid;
      gap: 12px;
      align-content: start;
    }

    .target-row {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 10px;
      align-items: center;
      padding: 10px;
      border: 2px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.74);
      box-shadow: 4px 4px 0 rgba(24, 26, 32, 0.88);
    }

    .target {
      display: flex;
      gap: 6px;
      min-width: 0;
      justify-content: center;
    }

    .target span {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border: 2px solid var(--line);
      border-radius: 8px;
      background: #fff;
      font-weight: 900;
    }

    .target span.done {
      background: var(--green);
      color: #fff;
    }

    .icon-btn {
      width: 42px;
      height: 42px;
      display: inline-grid;
      place-items: center;
      border: 2px solid var(--line);
      border-radius: 8px;
      color: var(--ink);
      background: #fff;
      box-shadow: 3px 3px 0 rgba(24, 26, 32, 0.88);
    }

    .icon-btn:hover,
    .icon-btn:focus-visible {
      transform: translate(-1px, -1px);
      outline: none;
    }

    .sound-box {
      width: min(100%, 620px);
      aspect-ratio: 1 / 1;
      justify-self: center;
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: clamp(8px, 1.5vw, 14px);
      padding: clamp(12px, 2vw, 18px);
      border: 4px solid var(--line);
      border-radius: 8px;
      background:
        linear-gradient(135deg, rgba(255,255,255,0.86), rgba(255,255,255,0.54)),
        repeating-linear-gradient(45deg, rgba(24,26,32,0.055) 0 8px, transparent 8px 18px);
      box-shadow: var(--shadow), 7px 7px 0 rgba(24, 26, 32, 0.94);
    }

    .tile {
      position: relative;
      min-width: 0;
      display: grid;
      place-items: center;
      border: 0;
      border-radius: 8px;
      background: transparent;
      isolation: isolate;
    }

    .tile:focus-visible {
      outline: 3px solid var(--ink);
      outline-offset: -3px;
    }

    .tile-shape {
      position: absolute;
      inset: 5%;
      border: 3px solid var(--line);
      box-shadow: 4px 4px 0 rgba(24, 26, 32, 0.86);
      transition: transform 120ms ease, filter 120ms ease;
      z-index: -1;
    }

    .tile:hover .tile-shape {
      transform: translate(-2px, -2px) scale(1.02);
      filter: brightness(1.04);
    }

    .tile.active .tile-shape {
      transform: translate(3px, 3px) scale(0.96);
      box-shadow: 1px 1px 0 rgba(24, 26, 32, 0.92);
    }

    .tile .letter {
      width: 42%;
      min-width: 30px;
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      border: 2px solid var(--line);
      border-radius: 50%;
      color: var(--ink);
      background: rgba(255,255,255,0.88);
      font-size: clamp(18px, 3vw, 36px);
      font-weight: 1000;
      line-height: 1;
      box-shadow: 2px 2px 0 rgba(24, 26, 32, 0.78);
    }

    .shape-circle {
      border-radius: 50%;
    }

    .shape-square {
      border-radius: 8px;
    }

    .shape-diamond {
      inset: 14%;
      transform: rotate(45deg);
      border-radius: 8px;
    }

    .tile:hover .shape-diamond {
      transform: rotate(45deg) translate(-2px, -2px) scale(1.02);
    }

    .tile.active .shape-diamond {
      transform: rotate(45deg) translate(3px, 3px) scale(0.96);
    }

    .shape-triangle {
      clip-path: polygon(50% 4%, 96% 92%, 4% 92%);
      border-radius: 0;
    }

    .shape-hex {
      clip-path: polygon(25% 5%, 75% 5%, 98% 50%, 75% 95%, 25% 95%, 2% 50%);
      border-radius: 0;
    }

    .shape-star {
      clip-path: polygon(50% 1%, 62% 34%, 98% 35%, 69% 56%, 79% 91%, 50% 70%, 21% 91%, 31% 56%, 2% 35%, 38% 34%);
      border-radius: 0;
    }

    .side {
      display: grid;
      gap: 14px;
      align-content: start;
    }

    .controls {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }

    .meter-panel,
    .log-panel,
    .mix-panel {
      padding: 12px;
      border: 2px solid var(--line);
      border-radius: 8px;
      background: rgba(255,255,255,0.78);
      box-shadow: 4px 4px 0 rgba(24, 26, 32, 0.88);
    }

    .mix-panel label {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 10px;
      align-items: center;
      font-size: 13px;
      font-weight: 800;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--red);
    }

    .meter {
      height: 18px;
      border: 2px solid var(--line);
      border-radius: 8px;
      background: #fff;
      overflow: hidden;
    }

    .meter-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--green), var(--yellow), var(--red));
      transition: width 180ms ease;
    }

    .log {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 6px;
      min-height: 76px;
      align-content: start;
    }

    .log span {
      height: 32px;
      display: grid;
      place-items: center;
      border: 2px solid var(--line);
      border-radius: 8px;
      background: #fff;
      font-weight: 900;
    }

    .log span.empty {
      opacity: 0.22;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 20px;
      transform: translateX(-50%) translateY(120px);
      max-width: calc(100vw - 28px);
      padding: 10px 14px;
      border: 2px solid var(--line);
      border-radius: 8px;
      background: #fff;
      box-shadow: 4px 4px 0 rgba(24, 26, 32, 0.92);
      font-weight: 900;
      opacity: 0;
      transition: transform 180ms ease, opacity 180ms ease;
      pointer-events: none;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    @media (max-width: 980px) {
      .stage {
        grid-template-columns: minmax(260px, 0.9fr) minmax(360px, 1.1fr);
      }

      .side {
        grid-column: 1 / -1;
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      .side .log-panel {
        grid-column: span 1;
      }
    }

    @media (max-width: 720px) {
      .app {
        width: min(100% - 20px, 540px);
        padding-top: 14px;
      }

      .topbar {
        grid-template-columns: 1fr;
      }

      .stats {
        justify-content: stretch;
      }

      .stat {
        flex: 1 1 30%;
      }

      .stage,
      .side {
        grid-template-columns: 1fr;
      }

      .performer {
        min-height: 250px;
      }

      .sound-box {
        gap: 7px;
        padding: 10px;
      }

      .target-row {
        grid-template-columns: auto 1fr auto;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <h1>字母乐队盒</h1>
      <div class="stats" aria-label="游戏数据">
        <div class="stat"><b id="score">0</b><span>分数</span></div>
        <div class="stat"><b id="combo">0</b><span>连击</span></div>
        <div class="stat"><b id="round">1</b><span>乐句</span></div>
      </div>
    </header>

    <section class="stage">
      <div class="band">
        <div>
          <p class="section-title"><span>角色</span><span id="characterName">Mira</span></p>
          <div class="picker" id="characterPicker"></div>
        </div>

        <div class="performer">
          <div class="spotlight"></div>
          <div class="avatar-wrap" id="avatarWrap" aria-live="polite"></div>
          <div class="avatar-name">
            <span id="stageName">Mira</span>
            <span class="now-note" id="nowNote">-</span>
          </div>
        </div>

        <div>
          <p class="section-title"><span>乐器</span><span id="instrumentName">吉他</span></p>
          <div class="picker" id="instrumentPicker"></div>
        </div>
      </div>

      <div class="pad">
        <div class="target-row">
          <button class="icon-btn" id="newPhrase" title="换一段" aria-label="换一段">
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
              <path d="M4 4v6h6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M20 20v-6h-6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M20 9A8 8 0 0 0 6.7 5.3L4 10" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M4 15a8 8 0 0 0 13.3 3.7L20 14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
          <div class="target" id="targetPhrase" aria-label="目标乐句"></div>
          <button class="icon-btn" id="playPhrase" title="播放" aria-label="播放">
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
              <path d="M8 5v14l11-7z" fill="currentColor"/>
            </svg>
          </button>
        </div>
        <div class="sound-box" id="soundBox" aria-label="字母图形盒"></div>
      </div>

      <aside class="side">
        <div class="controls" aria-label="控制">
          <button class="icon-btn" id="recordBtn" title="录音" aria-label="录音">
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
              <circle cx="12" cy="12" r="6" fill="currentColor"/>
            </svg>
          </button>
          <button class="icon-btn" id="loopBtn" title="循环" aria-label="循环">
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
              <path d="M17 2l4 4-4 4" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M3 11V9a3 3 0 0 1 3-3h15" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
              <path d="M7 22l-4-4 4-4" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M21 13v2a3 3 0 0 1-3 3H3" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
            </svg>
          </button>
          <button class="icon-btn" id="clearBtn" title="清空" aria-label="清空">
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
              <path d="M4 7h16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
              <path d="M10 11v6M14 11v6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
              <path d="M6 7l1 14h10l1-14M9 7V4h6v3" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </div>

        <div class="mix-panel">
          <p class="section-title"><span>音量</span><span id="volumeText">80%</span></p>
          <label>
            <span>Mix</span>
            <input id="volume" type="range" min="0" max="100" value="80">
          </label>
        </div>

        <div class="meter-panel">
          <p class="section-title"><span>能量</span><span id="energyText">0%</span></p>
          <div class="meter" aria-hidden="true"><div class="meter-fill" id="energyFill"></div></div>
        </div>

        <div class="log-panel">
          <p class="section-title"><span>录制</span><span id="recordState">待机</span></p>
          <div class="log" id="noteLog" aria-label="录制片段"></div>
        </div>
      </aside>
    </section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    const notes = [
      { letter: "A", freq: 261.63, color: "#f05d5e", shape: "circle" },
      { letter: "B", freq: 293.66, color: "#3d7bfd", shape: "square" },
      { letter: "C", freq: 329.63, color: "#2fbf71", shape: "triangle" },
      { letter: "D", freq: 349.23, color: "#f7c948", shape: "diamond" },
      { letter: "E", freq: 392.00, color: "#8b5cf6", shape: "hex" },
      { letter: "F", freq: 440.00, color: "#22b8cf", shape: "star" },
      { letter: "G", freq: 493.88, color: "#ff8a3d", shape: "circle" },
      { letter: "H", freq: 523.25, color: "#ff5da2", shape: "square" },
      { letter: "I", freq: 587.33, color: "#65d46e", shape: "diamond" },
      { letter: "J", freq: 659.25, color: "#5dd9ff", shape: "triangle" },
      { letter: "K", freq: 698.46, color: "#b17aff", shape: "hex" },
      { letter: "L", freq: 783.99, color: "#ffd166", shape: "star" }
    ];

    const characters = [
      { id: "mira", name: "Mira", hair: "#1f2937", skin: "#f2b28d", outfit: "#3d7bfd", accent: "#f7c948" },
      { id: "tao", name: "Tao", hair: "#4b2e1f", skin: "#d99062", outfit: "#2fbf71", accent: "#ffffff" },
      { id: "luna", name: "Luna", hair: "#8b5cf6", skin: "#f5c6a5", outfit: "#f05d5e", accent: "#22b8cf" },
      { id: "neo", name: "Neo", hair: "#111827", skin: "#c7d2fe", outfit: "#27222b", accent: "#ff8a3d" }
    ];

    const instruments = [
      { id: "guitar", name: "吉他", color: "#f05d5e" },
      { id: "keys", name: "键盘", color: "#3d7bfd" },
      { id: "drums", name: "鼓组", color: "#f7c948" },
      { id: "brass", name: "小号", color: "#ff8a3d" },
      { id: "synth", name: "合成器", color: "#8b5cf6" },
      { id: "bass", name: "贝斯", color: "#2fbf71" }
    ];

    const state = {
      character: characters[0],
      instrument: instruments[0],
      audio: null,
      master: null,
      score: 0,
      combo: 0,
      round: 1,
      energy: 0,
      phrase: [],
      phraseIndex: 0,
      recorded: [],
      recording: false,
      looping: false,
      loopTimer: null,
      volume: 0.8
    };

    const els = {
      characterPicker: document.querySelector("#characterPicker"),
      instrumentPicker: document.querySelector("#instrumentPicker"),
      avatarWrap: document.querySelector("#avatarWrap"),
      characterName: document.querySelector("#characterName"),
      instrumentName: document.querySelector("#instrumentName"),
      stageName: document.querySelector("#stageName"),
      nowNote: document.querySelector("#nowNote"),
      soundBox: document.querySelector("#soundBox"),
      score: document.querySelector("#score"),
      combo: document.querySelector("#combo"),
      round: document.querySelector("#round"),
      targetPhrase: document.querySelector("#targetPhrase"),
      newPhrase: document.querySelector("#newPhrase"),
      playPhrase: document.querySelector("#playPhrase"),
      recordBtn: document.querySelector("#recordBtn"),
      loopBtn: document.querySelector("#loopBtn"),
      clearBtn: document.querySelector("#clearBtn"),
      volume: document.querySelector("#volume"),
      volumeText: document.querySelector("#volumeText"),
      energyFill: document.querySelector("#energyFill"),
      energyText: document.querySelector("#energyText"),
      recordState: document.querySelector("#recordState"),
      noteLog: document.querySelector("#noteLog"),
      toast: document.querySelector("#toast")
    };

    function characterIcon(character) {
      return `
        <svg viewBox="0 0 80 80" aria-hidden="true">
          <circle cx="40" cy="24" r="17" fill="${character.hair}" stroke="#27222b" stroke-width="4"/>
          <circle cx="40" cy="31" r="16" fill="${character.skin}" stroke="#27222b" stroke-width="4"/>
          <path d="M19 74c2-18 12-28 21-28s19 10 21 28z" fill="${character.outfit}" stroke="#27222b" stroke-width="4" stroke-linejoin="round"/>
          <circle cx="34" cy="30" r="2.3" fill="#27222b"/>
          <circle cx="46" cy="30" r="2.3" fill="#27222b"/>
          <path d="M34 39c4 3 8 3 12 0" fill="none" stroke="#27222b" stroke-width="3" stroke-linecap="round"/>
          <path d="M28 19c8-9 22-8 29 2-11 0-19-2-29-2z" fill="${character.hair}" stroke="#27222b" stroke-width="3" stroke-linejoin="round"/>
          <circle cx="58" cy="52" r="7" fill="${character.accent}" stroke="#27222b" stroke-width="3"/>
        </svg>`;
    }

    function instrumentIcon(instrument) {
      const color = instrument.color;
      const icons = {
        guitar: `<path d="M29 49c-7 8-6 17 0 21 7 4 16 0 19-8 2-5 6-7 11-8 9-2 12-12 7-18-5-7-16-6-20 2-3 5-5 8-10 9-3 0-5 1-7 2z" fill="${color}" stroke="#27222b" stroke-width="4"/><circle cx="39" cy="56" r="8" fill="#fff" stroke="#27222b" stroke-width="4"/><path d="M52 36L70 18" stroke="#27222b" stroke-width="5" stroke-linecap="round"/><path d="M63 18l6-6" stroke="#27222b" stroke-width="7" stroke-linecap="round"/>`,
        keys: `<rect x="11" y="23" width="58" height="34" rx="6" fill="${color}" stroke="#27222b" stroke-width="4"/><path d="M18 37h44" stroke="#fff" stroke-width="4"/><path d="M22 25v20M32 25v20M42 25v20M52 25v20" stroke="#27222b" stroke-width="4"/><rect x="24" y="25" width="6" height="18" fill="#27222b"/><rect x="44" y="25" width="6" height="18" fill="#27222b"/>`,
        drums: `<ellipse cx="27" cy="48" rx="15" ry="12" fill="${color}" stroke="#27222b" stroke-width="4"/><ellipse cx="53" cy="48" rx="15" ry="12" fill="#fff" stroke="#27222b" stroke-width="4"/><circle cx="40" cy="31" r="11" fill="${color}" stroke="#27222b" stroke-width="4"/><path d="M16 21l18 11M64 21L46 32" stroke="#27222b" stroke-width="4" stroke-linecap="round"/>`,
        brass: `<path d="M17 47h31c7 0 11-4 11-10" fill="none" stroke="#27222b" stroke-width="8" stroke-linecap="round"/><path d="M56 25l14-8v28l-14-8z" fill="${color}" stroke="#27222b" stroke-width="4" stroke-linejoin="round"/><path d="M18 39v16M28 37v14M38 37v14" stroke="#27222b" stroke-width="4" stroke-linecap="round"/><path d="M15 47h-6" stroke="#27222b" stroke-width="5" stroke-linecap="round"/>`,
        synth: `<rect x="12" y="18" width="56" height="44" rx="8" fill="${color}" stroke="#27222b" stroke-width="4"/><circle cx="25" cy="32" r="6" fill="#fff" stroke="#27222b" stroke-width="4"/><circle cx="43" cy="32" r="6" fill="#f7c948" stroke="#27222b" stroke-width="4"/><path d="M21 50h38" stroke="#fff" stroke-width="5" stroke-linecap="round"/><path d="M27 44v12M39 44v12M51 44v12" stroke="#27222b" stroke-width="4"/>`,
        bass: `<path d="M24 53c-5 8 2 18 12 15 7-2 10-9 8-15 8 1 16-5 14-14-2-9-14-11-20-4-5 5-9 9-14 18z" fill="${color}" stroke="#27222b" stroke-width="4"/><circle cx="36" cy="55" r="7" fill="#fff" stroke="#27222b" stroke-width="4"/><path d="M47 36L66 16" stroke="#27222b" stroke-width="6" stroke-linecap="round"/><path d="M61 15h11" stroke="#27222b" stroke-width="6" stroke-linecap="round"/>`
      };
      return `<svg viewBox="0 0 80 80" aria-hidden="true">${icons[instrument.id]}</svg>`;
    }

    function fullAvatar() {
      const c = state.character;
      const instrument = instrumentIcon(state.instrument).replace("<svg viewBox=\"0 0 80 80\" aria-hidden=\"true\">", "<g transform=\"translate(18 104) scale(1.55)\">").replace("</svg>", "</g>");
      els.avatarWrap.innerHTML = `
        <svg viewBox="0 0 210 250" role="img" aria-label="${c.name} ${state.instrument.name}">
          <ellipse cx="105" cy="226" rx="74" ry="12" fill="rgba(24,26,32,0.18)"/>
          <path d="M70 126c-29 15-42 35-39 56" fill="none" stroke="#27222b" stroke-width="15" stroke-linecap="round"/>
          <path d="M140 126c29 15 42 35 39 56" fill="none" stroke="#27222b" stroke-width="15" stroke-linecap="round"/>
          <path d="M61 220l20-50M149 220l-20-50" stroke="#27222b" stroke-width="18" stroke-linecap="round"/>
          <path d="M75 218h-26M135 218h26" stroke="#27222b" stroke-width="16" stroke-linecap="round"/>
          <path d="M58 191c7-45 17-75 47-75s40 30 47 75z" fill="${c.outfit}" stroke="#27222b" stroke-width="7" stroke-linejoin="round"/>
          <path d="M77 136c10 15 46 15 56 0" fill="none" stroke="${c.accent}" stroke-width="7" stroke-linecap="round"/>
          <circle cx="105" cy="75" r="43" fill="${c.hair}" stroke="#27222b" stroke-width="7"/>
          <circle cx="105" cy="88" r="38" fill="${c.skin}" stroke="#27222b" stroke-width="7"/>
          <path d="M67 68c20-30 62-29 78 4-28 2-49-4-78-4z" fill="${c.hair}" stroke="#27222b" stroke-width="6" stroke-linejoin="round"/>
          <circle cx="91" cy="86" r="4.5" fill="#27222b"/>
          <circle cx="119" cy="86" r="4.5" fill="#27222b"/>
          <path d="M91 105c9 7 19 7 28 0" fill="none" stroke="#27222b" stroke-width="6" stroke-linecap="round"/>
          ${instrument}
        </svg>`;
    }

    function renderPickers() {
      els.characterPicker.innerHTML = characters.map((character) => `
        <button class="choice ${character.id === state.character.id ? "active" : ""}" data-character="${character.id}" aria-label="${character.name}">
          ${characterIcon(character)}
          <span>${character.name}</span>
        </button>`).join("");

      els.instrumentPicker.innerHTML = instruments.map((instrument) => `
        <button class="choice ${instrument.id === state.instrument.id ? "active" : ""}" data-instrument="${instrument.id}" aria-label="${instrument.name}">
          ${instrumentIcon(instrument)}
          <span>${instrument.name}</span>
        </button>`).join("");
    }

    function renderPads() {
      els.soundBox.innerHTML = notes.map((note) => `
        <button class="tile" data-letter="${note.letter}" aria-label="${note.letter}">
          <span class="tile-shape shape-${note.shape}" style="background:${note.color}"></span>
          <span class="letter">${note.letter}</span>
        </button>`).join("");
    }

    function initAudio() {
      if (state.audio) return;
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      state.audio = new AudioContext();
      state.master = state.audio.createGain();
      state.master.gain.value = state.volume;
      state.master.connect(state.audio.destination);
    }

    function envelope(gain, start, attack, decay, peak, end) {
      gain.gain.cancelScheduledValues(start);
      gain.gain.setValueAtTime(0.0001, start);
      gain.gain.exponentialRampToValueAtTime(peak, start + attack);
      gain.gain.exponentialRampToValueAtTime(0.0001, start + attack + decay);
      return end || start + attack + decay;
    }

    function playTone(note, delay = 0, strong = false) {
      initAudio();
      if (state.audio.state === "suspended") state.audio.resume();

      const ctx = state.audio;
      const t = ctx.currentTime + delay;
      const gain = ctx.createGain();
      const filter = ctx.createBiquadFilter();
      const freq = note.freq;
      const volumeBoost = strong ? 1.18 : 1;
      filter.connect(gain);
      gain.connect(state.master);

      if (state.instrument.id === "drums") {
        playDrum(ctx, t, freq, gain, strong);
        return;
      }

      const osc = ctx.createOscillator();
      const second = ctx.createOscillator();
      osc.frequency.setValueAtTime(freq, t);
      second.frequency.setValueAtTime(freq * getSecondRatio(), t);
      second.detune.setValueAtTime(state.instrument.id === "synth" ? 6 : -5, t);
      osc.type = getWave();
      second.type = state.instrument.id === "brass" ? "sawtooth" : "triangle";
      filter.type = state.instrument.id === "bass" ? "lowpass" : "bandpass";
      filter.frequency.setValueAtTime(getFilterFreq(freq), t);
      filter.Q.setValueAtTime(state.instrument.id === "brass" ? 4 : 1.2, t);
      osc.connect(filter);
      second.connect(filter);

      const length = getLength();
      envelope(gain, t, getAttack(), length, 0.28 * volumeBoost, t + length + 0.2);

      if (state.instrument.id === "guitar" || state.instrument.id === "bass") {
        osc.frequency.exponentialRampToValueAtTime(freq * 0.996, t + 0.24);
        second.frequency.exponentialRampToValueAtTime(freq * getSecondRatio() * 0.992, t + 0.28);
      }

      if (state.instrument.id === "brass") {
        osc.detune.setValueAtTime(-14, t);
        osc.detune.linearRampToValueAtTime(0, t + 0.08);
      }

      osc.start(t);
      second.start(t);
      osc.stop(t + length + 0.24);
      second.stop(t + length + 0.24);
    }

    function playDrum(ctx, t, freq, output, strong) {
      const kick = ctx.createOscillator();
      const snare = ctx.createBufferSource();
      const kickGain = ctx.createGain();
      const snareGain = ctx.createGain();
      const bufferSize = ctx.sampleRate * 0.18;
      const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
      const data = buffer.getChannelData(0);

      for (let i = 0; i < bufferSize; i++) {
        data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / bufferSize, 2);
      }

      kick.frequency.setValueAtTime(Math.max(55, freq / 4), t);
      kick.frequency.exponentialRampToValueAtTime(44, t + 0.16);
      kick.type = "sine";
      snare.buffer = buffer;
      kick.connect(kickGain);
      snare.connect(snareGain);
      kickGain.connect(output);
      snareGain.connect(output);
      kickGain.gain.setValueAtTime(strong ? 0.7 : 0.48, t);
      kickGain.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
      snareGain.gain.setValueAtTime(strong ? 0.28 : 0.18, t);
      snareGain.gain.exponentialRampToValueAtTime(0.001, t + 0.13);
      output.gain.setValueAtTime(0.42, t);
      output.gain.exponentialRampToValueAtTime(0.001, t + 0.24);
      kick.start(t);
      snare.start(t + 0.015);
      kick.stop(t + 0.24);
      snare.stop(t + 0.24);
    }

    function getWave() {
      return {
        guitar: "triangle",
        keys: "square",
        brass: "sawtooth",
        synth: "sawtooth",
        bass: "sine"
      }[state.instrument.id] || "triangle";
    }

    function getSecondRatio() {
      return {
        guitar: 2,
        keys: 1.5,
        brass: 1.01,
        synth: 2.01,
        bass: 0.5
      }[state.instrument.id] || 1;
    }

    function getFilterFreq(freq) {
      return {
        guitar: freq * 3.2,
        keys: freq * 2.4,
        brass: freq * 4.8,
        synth: freq * 5.5,
        bass: freq * 1.6
      }[state.instrument.id] || freq * 3;
    }

    function getAttack() {
      return {
        guitar: 0.006,
        keys: 0.012,
        brass: 0.05,
        synth: 0.02,
        bass: 0.004
      }[state.instrument.id] || 0.01;
    }

    function getLength() {
      return {
        guitar: 0.55,
        keys: 0.42,
        brass: 0.68,
        synth: 0.78,
        bass: 0.62
      }[state.instrument.id] || 0.46;
    }

    function hit(letter) {
      const note = notes.find((item) => item.letter === letter);
      if (!note) return;
      const expected = state.phrase[state.phraseIndex];
      const strong = expected === letter;
      playTone(note, 0, strong);
      animateHit(letter, strong);
      updateGame(letter, strong);
    }

    function previewHit(letter, delay = 0) {
      const note = notes.find((item) => item.letter === letter);
      if (!note) return;
      window.setTimeout(() => {
        playTone(note, 0, true);
        animateHit(letter, true);
      }, delay);
    }

    function animateHit(letter, strong) {
      const tile = document.querySelector(`[data-letter="${letter}"]`);
      if (tile) {
        tile.classList.add("active");
        window.setTimeout(() => tile.classList.remove("active"), 150);
      }
      els.avatarWrap.classList.remove("playing", "hit-strong");
      void els.avatarWrap.offsetWidth;
      els.avatarWrap.classList.add(strong ? "hit-strong" : "playing");
      window.setTimeout(() => els.avatarWrap.classList.remove("playing", "hit-strong"), 480);
      els.nowNote.textContent = letter;
    }

    function updateGame(letter, matched) {
      if (state.recording) {
        state.recorded.push(letter);
        if (state.recorded.length > 12) state.recorded.shift();
      }

      if (matched) {
        state.combo += 1;
        state.score += 10 + state.combo * 2;
        state.energy = Math.min(100, state.energy + 9 + Math.min(12, state.combo));
        state.phraseIndex += 1;
        if (state.phraseIndex >= state.phrase.length) {
          state.round += 1;
          state.score += 60 + state.combo * 3;
          state.energy = 100;
          showToast("乐句完成 +" + (60 + state.combo * 3));
          window.setTimeout(newPhrase, 520);
        }
      } else {
        state.combo = 0;
        state.energy = Math.max(0, state.energy - 12);
        state.phraseIndex = letter === state.phrase[0] ? 1 : 0;
      }

      renderTarget();
      renderStats();
      renderLog();
    }

    function newPhrase() {
      const length = Math.min(7, 3 + Math.floor(state.round / 2));
      const pool = notes.slice(0, Math.min(notes.length, 6 + state.round));
      state.phrase = Array.from({ length }, () => pool[Math.floor(Math.random() * pool.length)].letter);
      state.phraseIndex = 0;
      state.energy = Math.max(0, state.energy - 26);
      renderTarget();
      renderStats();
    }

    function renderTarget() {
      els.targetPhrase.innerHTML = state.phrase.map((letter, index) =>
        `<span class="${index < state.phraseIndex ? "done" : ""}">${letter}</span>`
      ).join("");
    }

    function renderStats() {
      els.score.textContent = state.score;
      els.combo.textContent = state.combo;
      els.round.textContent = state.round;
      els.energyFill.style.width = state.energy + "%";
      els.energyText.textContent = Math.round(state.energy) + "%";
    }

    function renderLog() {
      const cells = state.recorded.slice(-12);
      while (cells.length < 12) cells.push("");
      els.noteLog.innerHTML = cells.map((letter) =>
        `<span class="${letter ? "" : "empty"}">${letter || ""}</span>`
      ).join("");
      els.recordState.textContent = state.recording ? "录制中" : state.looping ? "循环中" : "待机";
      els.recordBtn.style.background = state.recording ? "#f05d5e" : "#fff";
      els.loopBtn.style.background = state.looping ? "#2fbf71" : "#fff";
    }

    function showToast(message) {
      els.toast.textContent = message;
      els.toast.classList.add("show");
      window.clearTimeout(showToast.timer);
      showToast.timer = window.setTimeout(() => els.toast.classList.remove("show"), 1100);
    }

    function playPhrase() {
      if (!state.phrase.length) return;
      state.phrase.forEach((letter, index) => previewHit(letter, index * 260));
    }

    function toggleLoop() {
      state.looping = !state.looping;
      window.clearInterval(state.loopTimer);
      if (state.looping) {
        if (!state.recorded.length) {
          state.looping = false;
          showToast("先录几个音");
        } else {
          let index = 0;
          state.loopTimer = window.setInterval(() => {
            previewHit(state.recorded[index % state.recorded.length]);
            index += 1;
          }, 300);
        }
      }
      renderLog();
    }

    function bindEvents() {
      els.characterPicker.addEventListener("click", (event) => {
        const button = event.target.closest("[data-character]");
        if (!button) return;
        state.character = characters.find((item) => item.id === button.dataset.character);
        updateSelection();
      });

      els.instrumentPicker.addEventListener("click", (event) => {
        const button = event.target.closest("[data-instrument]");
        if (!button) return;
        state.instrument = instruments.find((item) => item.id === button.dataset.instrument);
        updateSelection();
        const demo = notes[(state.round + state.combo) % notes.length];
        playTone(demo, 0, false);
      });

      els.soundBox.addEventListener("click", (event) => {
        const button = event.target.closest("[data-letter]");
        if (button) hit(button.dataset.letter);
      });

      window.addEventListener("keydown", (event) => {
        const letter = event.key.toUpperCase();
        if (notes.some((note) => note.letter === letter)) {
          event.preventDefault();
          hit(letter);
        }
      });

      els.newPhrase.addEventListener("click", () => {
        state.round += 1;
        newPhrase();
      });

      els.playPhrase.addEventListener("click", playPhrase);

      els.recordBtn.addEventListener("click", () => {
        state.recording = !state.recording;
        if (state.recording) state.recorded = [];
        showToast(state.recording ? "开始录制" : "停止录制");
        renderLog();
      });

      els.loopBtn.addEventListener("click", toggleLoop);

      els.clearBtn.addEventListener("click", () => {
        state.recorded = [];
        state.looping = false;
        window.clearInterval(state.loopTimer);
        renderLog();
      });

      els.volume.addEventListener("input", () => {
        state.volume = Number(els.volume.value) / 100;
        els.volumeText.textContent = els.volume.value + "%";
        if (state.master) state.master.gain.value = state.volume;
      });
    }

    function updateSelection() {
      els.characterName.textContent = state.character.name;
      els.stageName.textContent = state.character.name;
      els.instrumentName.textContent = state.instrument.name;
      renderPickers();
      fullAvatar();
    }

    function boot() {
      renderPickers();
      renderPads();
      fullAvatar();
      newPhrase();
      renderLog();
      bindEvents();
    }

    boot();
  </script>
</body>
</html>
