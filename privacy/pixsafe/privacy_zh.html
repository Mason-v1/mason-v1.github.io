<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", sans-serif; color: #111; background: #f6f6f4; }
    body { margin: 0; padding: 22px; line-height: 1.65; }
    h1 { font-size: 28px; line-height: 1.08; margin: 0 0 16px; letter-spacing: 0; }
    h2 { font-size: 17px; margin: 24px 0 8px; }
    p, li { font-size: 14px; color: #555; }
    .card { background: #fff; border: 1px solid #e4e4e1; border-radius: 18px; padding: 16px; }
    ul { padding-left: 20px; }
  </style>
</head>
<body>
  <h1>隐私协议</h1>
  <div class="card">
    <p>PixSafe以本地照片隐私处理为核心。你选择的照片会在本机完成扫描与清理。</p>
  </div>

  <h2>本地处理</h2>
  <p>App 会使用设备端能力扫描所选照片中的元数据、定位信息、人脸、二维码和可见文字。核心清理体验不会把照片上传到服务器。</p>

  <h2>清洁副本</h2>
  <p>导出结果会作为新的清洁副本生成，不会覆盖原图。清洁副本可以移除隐藏元数据，也可以包含你选择的可见打码区域。</p>

  <h2>数据收集</h2>
  <p>核心 App 不需要账号，不接入广告或跟踪 SDK。如后续加入分析或崩溃统计，应在正式发布前明确说明。</p>

  <h2>联系方式</h2>
  <p>如有隐私相关问题，请联系开发者：zhyl1881@163.com。</p>
</body>
</html>
