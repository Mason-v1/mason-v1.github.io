<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>餐厅小锅局</title>
  <style>
    :root {
      --ink: #1e1f25;
      --paper: #fff8ec;
      --panel: rgba(255,255,255,.86);
      --line: #24212a;
      --red: #f15b5b;
      --blue: #3577f0;
      --green: #31b978;
      --yellow: #f5c94a;
      --pink: #ff7aa9;
      --teal: #20b7a8;
      --steam: rgba(255,255,255,.86);
      --shadow: 0 20px 45px rgba(20,22,30,.16);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: ui-rounded, "SF Pro Rounded", "Microsoft YaHei", system-ui, sans-serif;
      background:
        linear-gradient(90deg, rgba(30,31,37,.045) 1px, transparent 1px),
        linear-gradient(0deg, rgba(30,31,37,.045) 1px, transparent 1px),
        linear-gradient(135deg, #fff8ec 0%, #edf8f5 45%, #fff1f5 100%);
      background-size: 30px 30px, 30px 30px, auto;
      overflow-x: hidden;
      user-select: none;
    }

    button { font: inherit; cursor: pointer; }

    .app {
      width: min(1220px, calc(100vw - 28px));
      min-height: 100vh;
      margin: 0 auto;
      padding: 18px 0 28px;
    }

    header {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 14px;
      align-items: center;
      margin-bottom: 14px;
    }

    h1 {
      margin: 0;
      font-size: clamp(30px, 4vw, 56px);
      line-height: 1;
      letter-spacing: 0;
    }

    .stats {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px;
    }

    .stat {
      min-width: 84px;
      padding: 9px 12px;
      border: 2px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: 4px 4px 0 rgba(30,31,37,.92);
      text-align: center;
    }

    .stat b {
      display: block;
      font-size: 21px;
      line-height: 1;
    }

    .stat span {
      display: block;
      margin-top: 4px;
      font-size: 12px;
      color: #666b78;
      font-weight: 800;
    }

    .scene {
      display: grid;
      grid-template-columns: minmax(250px, 320px) minmax(360px, 1fr) minmax(250px, 330px);
      gap: 16px;
      align-items: stretch;
    }

    .panel {
      min-width: 0;
      border: 3px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: var(--shadow), 6px 6px 0 rgba(30,31,37,.94);
    }

    .section-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin: 0 0 10px;
      font-size: 14px;
      font-weight: 1000;
      text-transform: uppercase;
    }

    .food-panel {
      padding: 12px;
      display: grid;
      align-content: start;
      gap: 12px;
    }

    .food-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 9px;
    }

    .food {
      min-height: 78px;
      display: grid;
      place-items: center;
      gap: 4px;
      padding: 8px;
      border: 2px solid var(--line);
      border-radius: 8px;
      background: #fff;
      box-shadow: 3px 3px 0 rgba(30,31,37,.9);
      transition: transform 130ms ease, box-shadow 130ms ease;
      touch-action: none;
    }

    .food:hover,
    .food:focus-visible {
      transform: translate(-1px, -1px);
      box-shadow: 5px 5px 0 rgba(30,31,37,.9);
      outline: none;
    }

    .food svg,
    .served svg,
    .held-card svg {
      width: 48px;
      height: 48px;
      overflow: visible;
    }

    .food span,
    .served span {
      font-size: 13px;
      font-weight: 900;
    }

    .worktop {
      position: relative;
      min-height: 646px;
      overflow: hidden;
      display: grid;
      grid-template-rows: auto 1fr auto;
      padding: 14px;
      background:
        linear-gradient(180deg, rgba(255,255,255,.76), rgba(255,255,255,.48)),
        repeating-linear-gradient(135deg, rgba(53,119,240,.08) 0 22px, rgba(49,185,120,.08) 22px 44px);
    }

    .pot-switch,
    .guest-switch {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }

    .switch-btn {
      min-height: 42px;
      padding: 7px 9px;
      border: 2px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--ink);
      box-shadow: 3px 3px 0 rgba(30,31,37,.9);
      font-size: 13px;
      font-weight: 900;
    }

    .switch-btn.active {
      background: var(--yellow);
      transform: translate(2px, 2px);
      box-shadow: 1px 1px 0 rgba(30,31,37,.9);
    }

    .table-stage {
      position: relative;
      display: grid;
      place-items: center;
      min-height: 410px;
    }

    .table {
      position: absolute;
      left: 5%;
      right: 5%;
      bottom: 16px;
      height: 166px;
      border: 4px solid var(--line);
      border-radius: 8px;
      background:
        linear-gradient(180deg, #f6d485 0 16%, #dd9f53 16% 100%);
      box-shadow: 0 18px 0 rgba(30,31,37,.12);
    }

    .table::before,
    .table::after {
      content: "";
      position: absolute;
      bottom: -72px;
      width: 26px;
      height: 76px;
      border: 4px solid var(--line);
      border-top: 0;
      background: #bd7640;
    }

    .table::before { left: 52px; }
    .table::after { right: 52px; }

    .pot-zone {
      position: relative;
      z-index: 2;
      width: min(72%, 360px);
      aspect-ratio: 1.18 / 1;
      display: grid;
      place-items: center;
      margin-top: 32px;
      border: 0;
      background: transparent;
      touch-action: none;
    }

    .pot-zone.targeted .pot-bowl {
      transform: translateY(-3px) scale(1.03);
      filter: saturate(1.2);
    }

    .steam {
      position: absolute;
      top: 0;
      width: 14px;
      height: 74px;
      border-radius: 50%;
      border-left: 5px solid var(--steam);
      animation: steam 1.4s ease-in-out infinite;
      opacity: .72;
    }

    .steam.one { left: 34%; animation-delay: 0s; }
    .steam.two { left: 49%; animation-delay: .26s; }
    .steam.three { left: 64%; animation-delay: .52s; }

    @keyframes steam {
      0% { transform: translateY(18px) scale(.72); opacity: 0; }
      35% { opacity: .9; }
      100% { transform: translateY(-18px) scale(1.14); opacity: 0; }
    }

    .pot-bowl {
      position: relative;
      width: 88%;
      height: 58%;
      margin-top: 58px;
      border: 5px solid var(--line);
      border-radius: 18px 18px 58px 58px;
      background: var(--pot-color, #f15b5b);
      box-shadow: 6px 9px 0 rgba(30,31,37,.9);
      transition: transform 160ms ease, filter 160ms ease;
      overflow: hidden;
    }

    .pot-bowl::before {
      content: "";
      position: absolute;
      left: 8%;
      right: 8%;
      top: 15%;
      height: 34%;
      border: 4px solid var(--line);
      border-radius: 50%;
      background: var(--soup-color, #ffd6be);
    }

    .pot-bowl::after {
      content: "";
      position: absolute;
      left: -22px;
      right: -22px;
      top: 34%;
      height: 12px;
      border-top: 5px solid rgba(255,255,255,.55);
      transform: rotate(-3deg);
    }

    .flame {
      position: absolute;
      left: 50%;
      bottom: 9px;
      width: 98px;
      height: 58px;
      transform: translateX(-50%);
      filter: drop-shadow(0 4px 0 rgba(30,31,37,.22));
    }

    .served {
      position: absolute;
      z-index: 4;
      left: 50%;
      top: 52%;
      width: 106px;
      min-height: 92px;
      display: none;
      place-items: center;
      gap: 2px;
      padding: 8px;
      border: 2px solid var(--line);
      border-radius: 8px;
      background: #fff;
      box-shadow: 4px 4px 0 rgba(30,31,37,.9);
      transform: translate(-50%, -50%);
      touch-action: none;
    }

    .served.ready { display: grid; animation: pop .22s ease; }

    @keyframes pop {
      from { transform: translate(-50%, -50%) scale(.7); opacity: .2; }
      to { transform: translate(-50%, -50%) scale(1); opacity: 1; }
    }

    .timer {
      position: absolute;
      z-index: 5;
      top: 88px;
      left: 50%;
      width: 160px;
      height: 18px;
      display: none;
      transform: translateX(-50%);
      border: 2px solid var(--line);
      border-radius: 8px;
      background: #fff;
      overflow: hidden;
    }

    .timer.active { display: block; }

    .timer-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, var(--green), var(--yellow), var(--red));
    }

    .tray {
      z-index: 2;
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
      align-self: end;
      padding: 10px;
      border: 3px solid var(--line);
      border-radius: 8px;
      background: rgba(255,255,255,.82);
    }

    .plate {
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      border: 2px solid var(--line);
      border-radius: 50%;
      background: #fff;
      box-shadow: inset 0 0 0 7px rgba(53,119,240,.1);
    }

    .guest-panel {
      position: relative;
      min-height: 646px;
      padding: 12px;
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 12px;
      background:
        linear-gradient(180deg, rgba(255,255,255,.72), rgba(255,255,255,.46)),
        repeating-linear-gradient(90deg, rgba(245,201,74,.14) 0 26px, rgba(255,122,169,.11) 26px 52px);
      overflow: hidden;
    }

    .guest-stage {
      position: relative;
      display: grid;
      place-items: end center;
      min-height: 390px;
    }

    .chair {
      position: absolute;
      bottom: 38px;
      width: 190px;
      height: 180px;
      border: 4px solid var(--line);
      border-radius: 22px 22px 8px 8px;
      background: #7bc9c2;
      box-shadow: 6px 6px 0 rgba(30,31,37,.9);
    }

    .chair::before,
    .chair::after {
      content: "";
      position: absolute;
      bottom: -58px;
      width: 24px;
      height: 62px;
      border: 4px solid var(--line);
      border-top: 0;
      background: #479b94;
    }

    .chair::before { left: 32px; }
    .chair::after { right: 32px; }

    .guest {
      position: relative;
      z-index: 2;
      width: min(250px, 82vw);
      aspect-ratio: 1 / 1.12;
      transform-origin: 50% 80%;
      transition: transform 140ms ease;
    }

    .guest.happy { animation: happy .62s ease; }
    .guest.nope { animation: nope .5s ease; }

    @keyframes happy {
      0%, 100% { transform: translateY(0) scale(1); }
      40% { transform: translateY(-10px) scale(1.04); }
      70% { transform: translateY(2px) scale(.99); }
    }

    @keyframes nope {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-10px) rotate(-4deg); }
      45% { transform: translateX(10px) rotate(4deg); }
      70% { transform: translateX(-6px) rotate(-2deg); }
    }

    .speech {
      position: absolute;
      z-index: 5;
      top: 26px;
      right: 10px;
      min-width: 86px;
      max-width: 150px;
      padding: 9px 12px;
      border: 2px solid var(--line);
      border-radius: 8px;
      background: #fff;
      box-shadow: 4px 4px 0 rgba(30,31,37,.92);
      font-size: 16px;
      font-weight: 1000;
      text-align: center;
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 160ms ease, transform 160ms ease;
    }

    .speech.show {
      opacity: 1;
      transform: translateY(0);
    }

    .mouth-zone {
      position: absolute;
      z-index: 6;
      top: 66%;
      left: 50%;
      width: 128px;
      height: 88px;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      pointer-events: none;
    }

    .mouth-zone.targeted {
      outline: 4px solid var(--green);
      outline-offset: 8px;
    }

    .taste-card {
      padding: 10px;
      border: 2px solid var(--line);
      border-radius: 8px;
      background: #fff;
      box-shadow: 3px 3px 0 rgba(30,31,37,.9);
      font-weight: 900;
    }

    .taste-line {
      display: flex;
      gap: 7px;
      flex-wrap: wrap;
      margin-top: 8px;
    }

    .tag {
      padding: 5px 8px;
      border: 2px solid var(--line);
      border-radius: 999px;
      background: #fff7c7;
      font-size: 12px;
      font-weight: 900;
    }

    .chopsticks {
      position: fixed;
      z-index: 30;
      left: 0;
      top: 0;
      width: 168px;
      height: 64px;
      transform: translate(-50%, -50%) rotate(-20deg);
      pointer-events: none;
      transition: opacity 140ms ease, transform 80ms linear;
      opacity: .92;
    }

    .stick {
      position: absolute;
      left: 0;
      width: 162px;
      height: 12px;
      border: 3px solid var(--line);
      border-radius: 999px;
      background: #b87539;
      box-shadow: 2px 2px 0 rgba(30,31,37,.9);
    }

    .stick.one { top: 16px; transform: rotate(5deg); }
    .stick.two { top: 36px; transform: rotate(-4deg); }
    .chopsticks.holding .stick.one { transform: rotate(10deg); }
    .chopsticks.holding .stick.two { transform: rotate(-10deg); }

    .held-card {
      position: fixed;
      z-index: 40;
      width: 88px;
      min-height: 82px;
      display: none;
      place-items: center;
      padding: 7px;
      border: 2px solid var(--line);
      border-radius: 8px;
      background: #fff;
      box-shadow: 5px 5px 0 rgba(30,31,37,.9);
      pointer-events: none;
      transform: translate(-50%, -50%);
    }

    .held-card.show { display: grid; }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 20px;
      z-index: 50;
      max-width: calc(100vw - 24px);
      padding: 10px 14px;
      border: 2px solid var(--line);
      border-radius: 8px;
      background: #fff;
      box-shadow: 4px 4px 0 rgba(30,31,37,.92);
      font-weight: 1000;
      opacity: 0;
      transform: translateX(-50%) translateY(90px);
      transition: opacity 180ms ease, transform 180ms ease;
      pointer-events: none;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    @media (max-width: 980px) {
      .scene {
        grid-template-columns: minmax(260px, .9fr) minmax(360px, 1.1fr);
      }

      .guest-panel {
        grid-column: 1 / -1;
        min-height: 520px;
      }
    }

    @media (max-width: 720px) {
      .app {
        width: min(100% - 20px, 560px);
        padding-top: 12px;
      }

      header,
      .scene {
        grid-template-columns: 1fr;
      }

      .stats {
        justify-content: stretch;
      }

      .stat {
        flex: 1 1 30%;
      }

      .worktop,
      .guest-panel {
        min-height: 520px;
      }

      .pot-switch,
      .guest-switch {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <h1>餐厅小锅局</h1>
      <div class="stats" aria-label="成绩">
        <div class="stat"><b id="score">0</b><span>好评</span></div>
        <div class="stat"><b id="streak">0</b><span>连赞</span></div>
        <div class="stat"><b id="servedCount">0</b><span>上菜</span></div>
      </div>
    </header>

    <section class="scene">
      <aside class="panel food-panel">
        <p class="section-title"><span>桌上菜</span><span id="selectedName">空筷</span></p>
        <div class="food-grid" id="foodGrid"></div>
      </aside>

      <section class="panel worktop">
        <div>
          <p class="section-title"><span>锅</span><span id="potName">番茄锅</span></p>
          <div class="pot-switch" id="potSwitch"></div>
        </div>

        <div class="table-stage">
          <div class="timer" id="timer"><div class="timer-fill" id="timerFill"></div></div>
          <button class="pot-zone" id="potZone" aria-label="锅">
            <span class="steam one"></span>
            <span class="steam two"></span>
            <span class="steam three"></span>
            <span class="pot-bowl" id="potBowl"></span>
            <svg class="flame" viewBox="0 0 120 80" aria-hidden="true">
              <path d="M60 70c29-14 20-39 8-53-2 16-14 19-18 35-8-11-4-26 4-40-31 18-43 49 6 58z" fill="#ff8a3d" stroke="#24212a" stroke-width="5" stroke-linejoin="round"/>
              <path d="M61 68c15-8 10-21 3-29-2 9-8 12-10 21-5-7-3-14 1-22-17 11-21 25 6 30z" fill="#f5c94a"/>
            </svg>
          </button>
          <div class="served" id="servedFood"></div>
          <div class="table"></div>
        </div>

        <div class="tray" aria-label="备用盘">
          <div class="plate"></div>
          <div class="plate"></div>
          <div class="plate"></div>
          <div class="plate"></div>
        </div>
      </section>

      <aside class="panel guest-panel">
        <div>
          <p class="section-title"><span>客人</span><span id="guestName">Mason</span></p>
          <div class="guest-switch" id="guestSwitch"></div>
        </div>

        <div class="guest-stage">
          <div class="speech" id="speech">好吃！</div>
          <div class="chair"></div>
          <div class="guest" id="guest"></div>
          <div class="mouth-zone" id="mouthZone"></div>
        </div>

        <div class="taste-card">
          <span id="tasteTitle">想吃：鲜、番茄、肉</span>
          <div class="taste-line" id="tasteTags"></div>
        </div>
      </aside>
    </section>
  </main>

  <div class="chopsticks" id="chopsticks" aria-hidden="true">
    <span class="stick one"></span>
    <span class="stick two"></span>
  </div>
  <div class="held-card" id="heldCard"></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    const foods = [
      { id: "beef", name: "牛肉", tags: ["肉", "鲜"], color: "#e05656", shape: "meat" },
      { id: "greens", name: "青菜", tags: ["菜", "清爽"], color: "#2fbf71", shape: "leaf" },
      { id: "mushroom", name: "蘑菇", tags: ["鲜", "菜"], color: "#c29b6b", shape: "mushroom" },
      { id: "tofu", name: "豆腐", tags: ["软", "清爽"], color: "#fff2c2", shape: "cube" },
      { id: "shrimp", name: "虾", tags: ["海鲜", "鲜"], color: "#ff7a72", shape: "shrimp" },
      { id: "corn", name: "玉米", tags: ["甜", "菜"], color: "#f5c94a", shape: "corn" },
      { id: "chili", name: "辣椒", tags: ["辣"], color: "#f15b5b", shape: "chili" },
      { id: "noodle", name: "面条", tags: ["主食", "软"], color: "#f0d89b", shape: "noodle" }
    ];

    const pots = [
      { id: "tomato", name: "番茄锅", color: "#f15b5b", soup: "#ffd1c1", tags: ["番茄", "鲜"] },
      { id: "clear", name: "清汤锅", color: "#3d9bd9", soup: "#d9f7ff", tags: ["清爽", "鲜"] },
      { id: "spicy", name: "麻辣锅", color: "#b91c1c", soup: "#ffad70", tags: ["辣", "肉"] },
      { id: "cheese", name: "奶酪锅", color: "#f5c94a", soup: "#fff2a6", tags: ["甜", "软"] },
      { id: "stone", name: "石锅", color: "#5c6470", soup: "#e5e7eb", tags: ["主食", "鲜"] },
      { id: "herb", name: "香草锅", color: "#31b978", soup: "#d7ffe4", tags: ["菜", "清爽"] }
    ];

    const guests = [
      { id: "mason", name: "Mason", skin: "#f0b98d", hair: "#20242c", shirt: "#3577f0", likes: ["鲜", "番茄", "肉"], dislikes: ["辣"] },
      { id: "mika", name: "Mika", skin: "#ffd2a8", hair: "#8b5cf6", shirt: "#ff7aa9", likes: ["甜", "软", "菜"], dislikes: ["海鲜"] },
      { id: "tao", name: "Tao", skin: "#d08d62", hair: "#4b2e1f", shirt: "#31b978", likes: ["辣", "肉", "主食"], dislikes: ["甜"] },
      { id: "nina", name: "Nina", skin: "#f4c29c", hair: "#111827", shirt: "#20b7a8", likes: ["清爽", "鲜", "海鲜"], dislikes: ["辣"] }
    ];

    const state = {
      pot: pots[0],
      guest: guests[0],
      held: null,
      heldCooked: false,
      dragStart: null,
      dragMoved: false,
      cooking: null,
      ready: null,
      score: 0,
      streak: 0,
      served: 0,
      pointer: { x: window.innerWidth / 2, y: window.innerHeight / 2 }
    };

    const els = {
      foodGrid: document.querySelector("#foodGrid"),
      potSwitch: document.querySelector("#potSwitch"),
      guestSwitch: document.querySelector("#guestSwitch"),
      potName: document.querySelector("#potName"),
      guestName: document.querySelector("#guestName"),
      selectedName: document.querySelector("#selectedName"),
      potZone: document.querySelector("#potZone"),
      potBowl: document.querySelector("#potBowl"),
      timer: document.querySelector("#timer"),
      timerFill: document.querySelector("#timerFill"),
      servedFood: document.querySelector("#servedFood"),
      guest: document.querySelector("#guest"),
      mouthZone: document.querySelector("#mouthZone"),
      speech: document.querySelector("#speech"),
      tasteTitle: document.querySelector("#tasteTitle"),
      tasteTags: document.querySelector("#tasteTags"),
      score: document.querySelector("#score"),
      streak: document.querySelector("#streak"),
      servedCount: document.querySelector("#servedCount"),
      chopsticks: document.querySelector("#chopsticks"),
      heldCard: document.querySelector("#heldCard"),
      toast: document.querySelector("#toast")
    };

    function foodIcon(food) {
      const c = food.color;
      const svg = {
        meat: `<path d="M22 44c-12-1-18-11-13-20 5-10 19-9 26-1 7-8 21-9 26 1 5 9-1 19-13 20-5 0-8 4-13 4s-8-4-13-4z" fill="${c}" stroke="#24212a" stroke-width="4"/><path d="M24 29c8 5 16 5 24 0" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/>`,
        leaf: `<path d="M13 54c28 2 43-12 43-43-29 0-45 16-43 43z" fill="${c}" stroke="#24212a" stroke-width="4"/><path d="M16 52c13-14 25-25 39-40" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/><path d="M29 39l-12-3M39 29l-2-12" fill="none" stroke="#24212a" stroke-width="3" stroke-linecap="round"/>`,
        mushroom: `<path d="M12 33c1-17 41-17 42 0z" fill="${c}" stroke="#24212a" stroke-width="4" stroke-linejoin="round"/><path d="M25 31h16l4 25H21z" fill="#fff2d8" stroke="#24212a" stroke-width="4" stroke-linejoin="round"/><circle cx="25" cy="24" r="4" fill="#fff"/><circle cx="41" cy="24" r="4" fill="#fff"/>`,
        cube: `<path d="M15 22l19-10 19 10v24L34 57 15 46z" fill="${c}" stroke="#24212a" stroke-width="4" stroke-linejoin="round"/><path d="M15 22l19 11 19-11M34 33v24" fill="none" stroke="#24212a" stroke-width="4" stroke-linejoin="round"/>`,
        shrimp: `<path d="M50 23c-18-16-45 3-30 23 11 14 32 6 27-9-2-7-12-8-17-3" fill="${c}" stroke="#24212a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M51 23l9-8M50 23l10 2" stroke="#24212a" stroke-width="4" stroke-linecap="round"/><circle cx="43" cy="27" r="2.5" fill="#24212a"/>`,
        corn: `<path d="M19 49c8-28 19-40 34-38 1 28-11 42-34 38z" fill="${c}" stroke="#24212a" stroke-width="4" stroke-linejoin="round"/><path d="M21 47c13-8 22-19 30-34M27 29l16 9M34 21l13 8" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/><path d="M18 51l-7 7M21 51l2 9" stroke="#31b978" stroke-width="5" stroke-linecap="round"/>`,
        chili: `<path d="M19 49c13-27 26-34 40-22-5 27-23 34-40 22z" fill="${c}" stroke="#24212a" stroke-width="4" stroke-linejoin="round"/><path d="M51 25c2-9 8-12 13-10" fill="none" stroke="#31b978" stroke-width="5" stroke-linecap="round"/>`,
        noodle: `<path d="M13 25c8-9 15 9 23 0s15 9 23 0M13 38c8-9 15 9 23 0s15 9 23 0M13 51c8-9 15 9 23 0s15 9 23 0" fill="none" stroke="${c}" stroke-width="8" stroke-linecap="round"/><path d="M13 25c8-9 15 9 23 0s15 9 23 0M13 38c8-9 15 9 23 0s15 9 23 0M13 51c8-9 15 9 23 0s15 9 23 0" fill="none" stroke="#24212a" stroke-width="3" stroke-linecap="round"/>`
      }[food.shape];
      return `<svg viewBox="0 0 70 70" aria-hidden="true">${svg}</svg>`;
    }

    function guestSvg(guest) {
      const mouth = guest.mouth || "M82 118c14 10 30 10 44 0";
      els.guest.innerHTML = `
        <svg viewBox="0 0 210 240" role="img" aria-label="${guest.name}">
          <ellipse cx="105" cy="224" rx="70" ry="12" fill="rgba(30,31,37,.18)"/>
          <path d="M61 215l19-52M149 215l-19-52" stroke="#24212a" stroke-width="18" stroke-linecap="round"/>
          <path d="M55 154c8-35 21-58 50-58s42 23 50 58v44H55z" fill="${guest.shirt}" stroke="#24212a" stroke-width="7" stroke-linejoin="round"/>
          <path d="M52 133c-26 18-31 38-19 54M158 133c26 18 31 38 19 54" fill="none" stroke="#24212a" stroke-width="15" stroke-linecap="round"/>
          <circle cx="105" cy="69" r="43" fill="${guest.hair}" stroke="#24212a" stroke-width="7"/>
          <circle cx="105" cy="84" r="40" fill="${guest.skin}" stroke="#24212a" stroke-width="7"/>
          <path d="M65 62c17-27 58-35 84 4-28 2-54-2-84-4z" fill="${guest.hair}" stroke="#24212a" stroke-width="6" stroke-linejoin="round"/>
          <circle cx="91" cy="82" r="4.6" fill="#24212a"/>
          <circle cx="119" cy="82" r="4.6" fill="#24212a"/>
          <path class="guest-mouth" d="${mouth}" fill="none" stroke="#24212a" stroke-width="6" stroke-linecap="round"/>
          <circle cx="72" cy="94" r="8" fill="#ff9ab6" opacity=".65"/>
          <circle cx="138" cy="94" r="8" fill="#ff9ab6" opacity=".65"/>
        </svg>`;
    }

    function renderFood() {
      els.foodGrid.innerHTML = foods.map((food) => `
        <button class="food" data-food="${food.id}" aria-label="${food.name}">
          ${foodIcon(food)}
          <span>${food.name}</span>
        </button>`).join("");
    }

    function renderSwitches() {
      els.potSwitch.innerHTML = pots.map((pot) => `
        <button class="switch-btn ${pot.id === state.pot.id ? "active" : ""}" data-pot="${pot.id}">${pot.name}</button>`).join("");
      els.guestSwitch.innerHTML = guests.map((guest) => `
        <button class="switch-btn ${guest.id === state.guest.id ? "active" : ""}" data-guest="${guest.id}">${guest.name}</button>`).join("");
    }

    function updateScene() {
      els.potName.textContent = state.pot.name;
      els.potBowl.style.setProperty("--pot-color", state.pot.color);
      els.potBowl.style.setProperty("--soup-color", state.pot.soup);
      els.guestName.textContent = state.guest.name;
      els.tasteTitle.textContent = "想吃：" + state.guest.likes.join("、");
      els.tasteTags.innerHTML = state.guest.likes.map((tag) => `<span class="tag">${tag}</span>`).join("");
      guestSvg(state.guest);
      renderSwitches();
      updateStats();
    }

    function pickFood(food, cooked = false, event) {
      if (state.cooking) {
        toast("锅正忙");
        return;
      }
      state.held = food;
      state.heldCooked = cooked;
      state.dragMoved = false;
      state.dragStart = event ? pointerFromEvent(event) : { ...state.pointer };
      if (event) setPointer(event);
      els.selectedName.textContent = cooked ? "熟" + food.name : food.name;
      els.heldCard.innerHTML = foodIcon(food) + `<span>${cooked ? "熟" : ""}${food.name}</span>`;
      els.heldCard.classList.add("show");
      els.chopsticks.classList.add("holding");
      moveTools();
    }

    function dropHeld(event) {
      if (!state.held) return;
      setPointer(event);
      const overPot = hitTest(els.potZone, state.pointer.x, state.pointer.y);
      const overMouth = isFeedTarget(state.pointer.x, state.pointer.y);

      if (!state.dragMoved && !overPot && !overMouth) return;

      if (!state.heldCooked && overPot) {
        cook(state.held);
      } else if (state.heldCooked && overMouth) {
        feed(state.held);
      } else {
        toast(state.heldCooked ? "对准嘴巴" : "先放进锅");
      }
      clearHeld();
    }

    function cook(food) {
      state.cooking = food;
      state.ready = null;
      els.servedFood.classList.remove("ready");
      els.timer.classList.add("active");
      els.timerFill.style.transition = "none";
      els.timerFill.style.width = "0%";
      window.requestAnimationFrame(() => {
        els.timerFill.style.transition = "width 1450ms linear";
        els.timerFill.style.width = "100%";
      });
      toast(food.name + "下锅");
      window.setTimeout(() => {
        state.cooking = null;
        state.ready = food;
        els.timer.classList.remove("active");
        els.servedFood.innerHTML = foodIcon(food) + `<span>熟${food.name}</span>`;
        els.servedFood.classList.add("ready");
        toast("煮好了");
      }, 1500);
    }

    function feed(food) {
      const result = taste(food);
      state.served += 1;
      if (result.good) {
        state.streak += 1;
        state.score += 10 + state.streak * 3 + result.matches * 4;
        react("happy", "好吃！");
      } else {
        state.streak = 0;
        state.score = Math.max(0, state.score - 4);
        react("nope", "不太行");
      }
      state.ready = null;
      els.servedFood.classList.remove("ready");
      updateStats();
    }

    function taste(food) {
      const tags = [...food.tags, ...state.pot.tags];
      const matches = tags.filter((tag) => state.guest.likes.includes(tag)).length;
      const dislikes = tags.filter((tag) => state.guest.dislikes.includes(tag)).length;
      return { good: matches >= 2 && dislikes === 0, matches };
    }

    function react(kind, words) {
      state.guest.mouth = kind === "happy" ? "M82 113c11 19 35 19 46 0" : "M85 122c13-8 27-8 40 0";
      guestSvg(state.guest);
      els.guest.classList.remove("happy", "nope");
      void els.guest.offsetWidth;
      els.guest.classList.add(kind);
      els.speech.textContent = words;
      els.speech.classList.add("show");
      window.setTimeout(() => {
        els.speech.classList.remove("show");
        delete state.guest.mouth;
        guestSvg(state.guest);
      }, 1150);
    }

    function updateStats() {
      els.score.textContent = state.score;
      els.streak.textContent = state.streak;
      els.servedCount.textContent = state.served;
    }

    function clearHeld() {
      state.held = null;
      state.heldCooked = false;
      state.dragStart = null;
      state.dragMoved = false;
      els.selectedName.textContent = "空筷";
      els.heldCard.classList.remove("show");
      els.chopsticks.classList.remove("holding");
      els.potZone.classList.remove("targeted");
      els.mouthZone.classList.remove("targeted");
    }

    function setPointer(event) {
      state.pointer = pointerFromEvent(event);
      if (state.held && state.dragStart) {
        const dx = state.pointer.x - state.dragStart.x;
        const dy = state.pointer.y - state.dragStart.y;
        if (Math.hypot(dx, dy) > 10) state.dragMoved = true;
      }
    }

    function pointerFromEvent(event) {
      const touch = event.touches && event.touches[0];
      return {
        x: touch ? touch.clientX : event.clientX,
        y: touch ? touch.clientY : event.clientY
      };
    }

    function moveTools() {
      const x = state.pointer.x;
      const y = state.pointer.y;
      els.chopsticks.style.transform = `translate(${x - 118}px, ${y - 42}px) rotate(-20deg)`;
      els.heldCard.style.left = x + "px";
      els.heldCard.style.top = y + "px";
      els.potZone.classList.toggle("targeted", !!state.held && !state.heldCooked && hitTest(els.potZone, x, y));
      els.mouthZone.classList.toggle("targeted", !!state.held && state.heldCooked && isFeedTarget(x, y));
    }

    function hitTest(element, x, y) {
      const rect = element.getBoundingClientRect();
      return x >= rect.left && x <= rect.right && y >= rect.top && y <= rect.bottom;
    }

    function isFeedTarget(x, y) {
      if (hitTest(els.mouthZone, x, y)) return true;
      const rect = els.guest.getBoundingClientRect();
      const faceLeft = rect.left + rect.width * 0.24;
      const faceRight = rect.right - rect.width * 0.24;
      const faceTop = rect.top + rect.height * 0.2;
      const faceBottom = rect.top + rect.height * 0.62;
      return x >= faceLeft && x <= faceRight && y >= faceTop && y <= faceBottom;
    }

    function toast(message) {
      els.toast.textContent = message;
      els.toast.classList.add("show");
      window.clearTimeout(toast.timer);
      toast.timer = window.setTimeout(() => els.toast.classList.remove("show"), 980);
    }

    function bindEvents() {
      els.foodGrid.addEventListener("pointerdown", (event) => {
        const button = event.target.closest("[data-food]");
        if (!button) return;
        button.setPointerCapture(event.pointerId);
        pickFood(foods.find((food) => food.id === button.dataset.food), false, event);
      });

      els.servedFood.addEventListener("pointerdown", (event) => {
        if (!state.ready) return;
        els.servedFood.setPointerCapture(event.pointerId);
        pickFood(state.ready, true, event);
      });

      window.addEventListener("pointermove", (event) => {
        setPointer(event);
        moveTools();
      });

      window.addEventListener("pointerup", dropHeld);

      els.foodGrid.addEventListener("click", (event) => {
        const button = event.target.closest("[data-food]");
        if (!button || state.held) return;
        pickFood(foods.find((food) => food.id === button.dataset.food), false, event);
      });

      els.potZone.addEventListener("click", (event) => {
        if (state.held && !state.heldCooked) {
          cook(state.held);
          clearHeld();
        } else if (state.ready) {
          pickFood(state.ready, true, event);
        }
      });

      els.guest.addEventListener("click", () => {
        if (state.held && state.heldCooked) {
          feed(state.held);
          clearHeld();
        }
      });

      els.potSwitch.addEventListener("click", (event) => {
        const button = event.target.closest("[data-pot]");
        if (!button) return;
        state.pot = pots.find((pot) => pot.id === button.dataset.pot);
        updateScene();
      });

      els.guestSwitch.addEventListener("click", (event) => {
        const button = event.target.closest("[data-guest]");
        if (!button) return;
        state.guest = guests.find((guest) => guest.id === button.dataset.guest);
        updateScene();
      });
    }

    function boot() {
      renderFood();
      updateScene();
      bindEvents();
      moveTools();
    }

    boot();
  </script>
</body>
</html>
